<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中1理科 光の反射シミュレーション</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }

    /* カスタムスライダー（iPadで触りやすい特大サイズ） */
    input[type=range].big-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: #334155;
      border-radius: 999px;
      outline: none;
    }
    input[type=range].big-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f43f5e;
      border: 4px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.6);
    }

    /* ボタンのバウンス効果 */
    .btn-push {
      transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-push:active {
      transform: scale(0.96);
    }

    /* ドラッグハンドルのパルスアニメーション */
    @keyframes pulse-ring {
      0% { r: 28px; opacity: 0.6; }
      70% { r: 44px; opacity: 0; }
      100% { r: 44px; opacity: 0; }
    }
    .drag-pulse {
      animation: pulse-ring 2s infinite;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-3 lg:p-4 select-none">

  <!-- 上部ヘッダー -->
  <header class="flex items-center justify-between bg-slate-800/90 border border-slate-700 rounded-2xl px-5 py-2.5 shadow-lg shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-rose-500 flex items-center justify-center shadow-md shadow-rose-500/30">
        <!-- 光アイコン -->
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364 6.364l-1.414-1.414M6.05 6.05L4.636 4.636m12.728 0l-1.414 1.414M6.05 17.95l-1.414 1.414M12 8a4 4 0 100 8 4 4 0 000-8z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl lg:text-2xl font-extrabold tracking-wide text-white leading-tight">
          光の反射のきまり <span class="text-amber-400 text-lg lg:text-xl ml-1">〜入射角と反射角〜</span>
        </h1>
      </div>
    </div>

    <!-- ワンポイント解説バナー -->
    <div id="guideMessage" class="bg-slate-900/90 border-2 border-amber-400/70 rounded-xl px-4 py-1.5 text-base lg:text-lg font-bold text-amber-200 flex items-center gap-2">
      <span>💡</span>
      <span id="guideText">レーザーの赤いボタンか、右上の「▶ 光を発射！」を押してみよう！</span>
    </div>
  </header>

  <!-- メインエリア（左：実験キャンバス / 右：コントロールパネル） -->
  <main class="flex-1 flex gap-4 my-2.5 min-h-0 overflow-hidden">

    <!-- 左側：実験ステージ（SVGキャンバス） -->
    <section class="flex-[1.65] bg-slate-900 border-2 border-slate-700 rounded-3xl relative flex flex-col items-center justify-center overflow-hidden shadow-2xl">
      
      <!-- 左上：凡例表示 -->
      <div class="absolute top-4 left-4 bg-slate-800/90 backdrop-blur border border-slate-600 rounded-2xl p-3 flex flex-col gap-2 z-10 shadow-md">
        <div class="flex items-center gap-2.5">
          <span class="w-6 h-2 rounded-full bg-rose-500 inline-block shadow-[0_0_8px_#f43f5e]"></span>
          <span class="text-base lg:text-lg font-bold text-rose-300">入射光（進む光）</span>
        </div>
        <div class="flex items-center gap-2.5">
          <span class="w-6 h-2 rounded-full bg-amber-400 inline-block shadow-[0_0_8px_#fbbf24]"></span>
          <span class="text-base lg:text-lg font-bold text-amber-300">反射光（はね返る光）</span>
        </div>
      </div>

      <!-- 右上：光の発射＆速度コントロール -->
      <div class="absolute top-4 right-4 flex items-center gap-2 z-10">
        <button id="btnSlow" onclick="toggleSlowMotion()" class="btn-push bg-amber-500 hover:bg-amber-400 border-2 border-amber-200 text-slate-950 font-extrabold px-4 py-2.5 rounded-2xl text-base lg:text-lg flex items-center gap-2 shadow-lg">
          <span id="slowIcon">🐢</span>
          <span id="slowLabel">ゆっくり見る：ON</span>
        </button>
        <button id="btnFire" onclick="replayBeamAnimation()" class="btn-push bg-rose-600 hover:bg-rose-500 border-2 border-rose-300 text-white font-extrabold px-5 py-2.5 rounded-2xl text-base lg:text-lg flex items-center gap-2 shadow-lg shadow-rose-600/40 animate-pulse">
          <span>▶</span>
          <span>光を発射！</span>
        </button>
      </div>

      <!-- インタラクティブSVGキャンバス -->
      <!-- 中心（鏡への入射点）を (500, 520) に設定 -->
      <svg id="simSvg" viewBox="0 0 1000 640" class="w-full h-full touch-none">
        <defs>
          <!-- 鏡のグラデーション -->
          <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#64748b" />
            <stop offset="20%" stop-color="#cbd5e1" />
            <stop offset="50%" stop-color="#f8fafc" />
            <stop offset="80%" stop-color="#94a3b8" />
            <stop offset="100%" stop-color="#64748b" />
          </linearGradient>

          <!-- 入射角・反射角の扇形グラデーション -->
          <radialGradient id="incAngleGrad" cx="50%" cy="100%" r="100%">
            <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
          </radialGradient>
          <radialGradient id="refAngleGrad" cx="50%" cy="100%" r="100%">
            <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2" />
          </radialGradient>

          <!-- レーザーポインター本体のグラデーション -->
          <linearGradient id="pointerBody" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e2e8f0" />
            <stop offset="50%" stop-color="#94a3b8" />
            <stop offset="100%" stop-color="#475569" />
          </linearGradient>

          <!-- 光のグローフィルタ -->
          <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="glowYellow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- 背景グリッド（薄い方眼） -->
        <g stroke="#1e293b" stroke-width="1">
          <line x1="0" y1="120" x2="1000" y2="120" />
          <line x1="0" y1="220" x2="1000" y2="220" />
          <line x1="0" y1="320" x2="1000" y2="320" />
          <line x1="0" y1="420" x2="1000" y2="420" />
          <line x1="100" y1="0" x2="100" y2="520" />
          <line x1="200" y1="0" x2="200" y2="520" />
          <line x1="300" y1="0" x2="300" y2="520" />
          <line x1="400" y1="0" x2="400" y2="520" />
          <line x1="500" y1="0" x2="500" y2="520" />
          <line x1="600" y1="0" x2="600" y2="520" />
          <line x1="700" y1="0" x2="700" y2="520" />
          <line x1="800" y1="0" x2="800" y2="520" />
          <line x1="900" y1="0" x2="900" y2="520" />
        </g>

        <!-- 10°ごとのガイドドット（ドラッグしやすくする薄い目印） -->
        <g id="snapDotsGroup" opacity="0.35"></g>

        <!-- ================= 分度器レイヤー（ON/OFF） ================= -->
        <g id="protractorLayer" class="transition-opacity duration-300" style="opacity: 0; pointer-events: none;">
          <!-- 半透明の分度器ベース -->
          <path d="M 180 520 A 320 320 0 0 1 820 520 Z" fill="#1e293b" fill-opacity="0.82" stroke="#38bdf8" stroke-width="3" />
          <path d="M 250 520 A 250 250 0 0 1 750 520 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
          <path d="M 420 520 A 80 80 0 0 1 580 520 Z" fill="#0f172a" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5" />
          <!-- 目盛り線と数字（JSで生成） -->
          <g id="protractorTicks"></g>
        </g>

        <!-- ================= 角度の扇形＆数値レイヤー（ON/OFF） ================= -->
        <g id="angleValueLayer" class="transition-opacity duration-300" style="opacity: 0; pointer-events: none;">
          <!-- 入射角の扇形 -->
          <path id="incidentArc" d="" fill="url(#incAngleGrad)" stroke="#fb7185" stroke-width="3" />
          <!-- 反射角の扇形 -->
          <path id="reflectionArc" d="" fill="url(#refAngleGrad)" stroke="#fcd34d" stroke-width="3" />

          <!-- 入射角ラベルボックス -->
          <g id="incidentLabelGroup">
            <rect x="-95" y="-32" width="190" height="64" rx="16" fill="#881337" fill-opacity="0.95" stroke="#fb7185" stroke-width="3" />
            <text x="0" y="-6" text-anchor="middle" fill="#fecdd3" font-size="19" font-weight="800">入射角</text>
            <text id="incidentAngleText" x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">50°</text>
          </g>

          <!-- 反射角ラベルボックス -->
          <g id="reflectionLabelGroup">
            <rect x="-95" y="-32" width="190" height="64" rx="16" fill="#78350f" fill-opacity="0.95" stroke="#fcd34d" stroke-width="3" />
            <text x="0" y="-6" text-anchor="middle" fill="#fde68a" font-size="19" font-weight="800">反射角</text>
            <text id="reflectionAngleText" x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">50°</text>
          </g>

          <!-- 0°のときの特別ラベル -->
          <g id="zeroDegreeBadge" style="display: none;" transform="translate(500, 290)">
            <rect x="-190" y="-42" width="380" height="84" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
            <text x="0" y="-6" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="800">鏡に垂直に当たるとき</text>
            <text x="0" y="28" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">入射角 0° ＝ 反射角 0°</text>
          </g>
        </g>

        <!-- ================= 鏡に垂直な線（法線）レイヤー（ON/OFF） ================= -->
        <g id="normalLineLayer" class="transition-opacity duration-300" style="opacity: 0; pointer-events: none;">
          <!-- 直角マーク ∟ -->
          <polyline points="500,492 528,492 528,520" fill="none" stroke="#38bdf8" stroke-width="4" />
          <text x="558" y="505" fill="#38bdf8" font-size="20" font-weight="800">90°(垂直)</text>

          <!-- 垂直な点線（法線） -->
          <line x1="500" y1="520" x2="500" y2="65" stroke="#38bdf8" stroke-width="5" stroke-dasharray="14,10" stroke-linecap="round" />

          <!-- 上部ラベル -->
          <g transform="translate(500, 42)">
            <rect x="-125" y="-22" width="250" height="40" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" />
            <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">鏡に垂直な線（法線）</text>
          </g>
        </g>

        <!-- ================= 鏡（ミラー）本体 ================= -->
        <g id="mirrorGroup">
          <!-- 鏡の裏側の斜線ハッチング（理科の図記号風） -->
          <rect x="110" y="520" width="780" height="18" fill="url(#mirrorGrad)" stroke="#e2e8f0" stroke-width="2" rx="4" />
          <g stroke="#64748b" stroke-width="3" opacity="0.7">
            <line x1="140" y1="538" x2="125" y2="560" />
            <line x1="190" y1="538" x2="175" y2="560" />
            <line x1="240" y1="538" x2="225" y2="560" />
            <line x1="290" y1="538" x2="275" y2="560" />
            <line x1="340" y1="538" x2="325" y2="560" />
            <line x1="390" y1="538" x2="375" y2="560" />
            <line x1="440" y1="538" x2="425" y2="560" />
            <line x1="490" y1="538" x2="475" y2="560" />
            <line x1="540" y1="538" x2="525" y2="560" />
            <line x1="590" y1="538" x2="575" y2="560" />
            <line x1="640" y1="538" x2="625" y2="560" />
            <line x1="690" y1="538" x2="675" y2="560" />
            <line x1="740" y1="538" x2="725" y2="560" />
            <line x1="790" y1="538" x2="775" y2="560" />
            <line x1="840" y1="538" x2="825" y2="560" />
          </g>
          <text x="500" y="595" text-anchor="middle" fill="#cbd5e1" font-size="26" font-weight="800" letter-spacing="8">かがみ（鏡）</text>
        </g>

        <!-- ================= 光線（入射光＆反射光）レイヤー ================= -->
        <g id="laserBeamsGroup">
          <!-- 入射光（赤いレーザー） -->
          <line id="incidentBeamGlow" x1="200" y1="200" x2="500" y2="520" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" opacity="0.4" filter="url(#glowRed)" style="display: none;" />
          <line id="incidentBeamCore" x1="200" y1="200" x2="500" y2="520" stroke="#fda4af" stroke-width="5" stroke-linecap="round" style="display: none;" />

          <!-- 反射光（黄色〜オレンジのレーザー：入射光と区別しやすく視認性抜群） -->
          <line id="reflectionBeamGlow" x1="500" y1="520" x2="800" y2="200" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.45" filter="url(#glowYellow)" style="display: none;" />
          <line id="reflectionBeamCore" x1="500" y1="520" x2="800" y2="200" stroke="#fef08a" stroke-width="5" stroke-linecap="round" style="display: none;" />

          <!-- 光が進む向きを示す動く矢印・光の粒グループ -->
          <g id="movingParticlesGroup"></g>

          <!-- 入射点（鏡に当たる中心点）のキラッと光るエフェクト -->
          <circle id="hitPointGlow" cx="500" cy="520" r="12" fill="#ffffff" filter="url(#glowYellow)" style="opacity: 0;" />
          <circle id="hitPointCore" cx="500" cy="520" r="6" fill="#ffffff" style="opacity: 0;" />
        </g>

        <!-- ================= レーザーポインター（ドラッグ操作可能） ================= -->
        <g id="laserPointerGroup" class="cursor-grab active:cursor-grabbing">
          <!-- タッチ領域を広げる透明サークル -->
          <circle cx="0" cy="0" r="60" fill="transparent" />
          <!-- パルスリング -->
          <circle cx="0" cy="0" r="30" fill="none" stroke="#f43f5e" stroke-width="3" class="drag-pulse" />
          
          <!-- レーザーポインターのイラスト（中心(0,0)から鏡の方向へ向く） -->
          <g id="pointerGraphic">
            <!-- 本体筒 -->
            <rect x="-65" y="-18" width="95" height="36" rx="10" fill="url(#pointerBody)" stroke="#f8fafc" stroke-width="3" />
            <!-- グリップ模様 -->
            <line x1="-40" y1="-16" x2="-40" y2="16" stroke="#334155" stroke-width="4" />
            <line x1="-28" y1="-16" x2="-28" y2="16" stroke="#334155" stroke-width="4" />
            <line x1="-16" y1="-16" x2="-16" y2="16" stroke="#334155" stroke-width="4" />
            <!-- 先端ノズル -->
            <path d="M 30 -12 L 46 -7 L 46 7 L 30 12 Z" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
            <!-- 赤いスイッチボタン（タップで光を発射） -->
            <g id="pointerRedBtn" class="cursor-pointer">
              <circle cx="0" cy="0" r="22" fill="transparent" />
              <circle id="pointerBtnRing" cx="0" cy="0" r="14" fill="#f43f5e" opacity="0.4" class="animate-ping" />
              <circle id="pointerBtnBody" cx="0" cy="0" r="11" fill="#e11d48" stroke="#ffffff" stroke-width="2.5" />
              <circle cx="-3" cy="-3" r="3.5" fill="#fda4af" />
            </g>
          </g>
        </g>
      </svg>

      <!-- 下部フローティングヒント -->
      <div class="absolute bottom-3 left-4 bg-slate-800/85 border border-slate-600 px-4 py-1.5 rounded-xl text-sm lg:text-base text-slate-300 font-bold">
        👆 レーザーはゆびで動かせるよ！本体の<span class="text-rose-400 font-extrabold">赤いボタン</span>を押しても光が発射！
      </div>
    </section>

    <!-- 右側：操作パネル（iPadで押しやすい特大UI） -->
    <aside class="flex-1 flex flex-col justify-between gap-3 min-w-[340px] max-w-[440px]">

      <!-- パネル1：角度の調整（0°〜80°、10°単位） -->
      <div class="bg-slate-800 border-2 border-slate-700 rounded-3xl p-4 shadow-xl flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h2 class="text-lg lg:text-xl font-extrabold text-white flex items-center gap-2">
            <span class="bg-rose-500 text-white w-7 h-7 rounded-lg inline-flex items-center justify-center text-base">1</span>
            光を当てる角度（10°きざみ）
          </h2>
          <span id="currentSettingBadge" class="bg-slate-900 border border-slate-600 px-3 py-1 rounded-xl text-rose-400 font-extrabold text-lg">
            角度：50°
          </span>
        </div>

        <!-- スライダー -->
        <div class="px-2 py-1">
          <input id="angleSlider" type="range" min="0" max="80" step="10" value="50" class="big-slider" oninput="setAngle(parseInt(this.value), true)">
          <div class="flex justify-between text-xs lg:text-sm font-bold text-slate-400 mt-1.5 px-1">
            <span>0°(垂直)</span>
            <span>20°</span>
            <span>40°</span>
            <span>60°</span>
            <span>80°(ななめ)</span>
          </div>
        </div>

        <!-- 10°単位のダイレクト選択ボタン -->
        <div class="grid grid-cols-5 gap-2" id="angleButtonsGrid">
          <!-- JSで 0°〜80° ボタンを生成 -->
        </div>
      </div>

      <!-- パネル2：段階的に理解する表示スイッチ -->
      <div class="bg-slate-800 border-2 border-slate-700 rounded-3xl p-4 shadow-xl flex-1 flex flex-col justify-between gap-2.5">
        <h2 class="text-lg lg:text-xl font-extrabold text-white flex items-center gap-2">
          <span class="bg-sky-500 text-white w-7 h-7 rounded-lg inline-flex items-center justify-center text-base">2</span>
          調べるツールを出してみよう
        </h2>

        <!-- スイッチ1：鏡に垂直な線（法線） -->
        <button id="toggleNormalBtn" onclick="toggleNormalLine()" class="btn-push w-full bg-slate-900 hover:bg-slate-850 border-2 border-slate-600 rounded-2xl p-3 flex items-center justify-between text-left transition-all">
          <div class="flex items-center gap-3">
            <div id="normalIconBox" class="w-12 h-12 rounded-xl bg-slate-700 flex items-center justify-center text-2xl font-extrabold text-sky-400">
              ⊥
            </div>
            <div>
              <div class="text-base lg:text-lg font-extrabold text-white">鏡に垂直な線（法線）</div>
              <div class="text-xs lg:text-sm font-bold text-slate-400">まず鏡に対して90°の線を引こう</div>
            </div>
          </div>
          <div id="normalStatusBadge" class="px-4 py-2 rounded-xl font-extrabold text-base bg-slate-700 text-slate-300">
            OFF
          </div>
        </button>

        <!-- スイッチ2：分度器 -->
        <button id="toggleProtractorBtn" onclick="toggleProtractor()" class="btn-push w-full bg-slate-900 hover:bg-slate-850 border-2 border-slate-600 rounded-2xl p-3 flex items-center justify-between text-left transition-all">
          <div class="flex items-center gap-3">
            <div id="protractorIconBox" class="w-12 h-12 rounded-xl bg-slate-700 flex items-center justify-center text-2xl">
              📐
            </div>
            <div>
              <div class="text-base lg:text-lg font-extrabold text-white">分度器をおく</div>
              <div class="text-xs lg:text-sm font-bold text-slate-400">垂直な線(0°)から角度をはかろう</div>
            </div>
          </div>
          <div id="protractorStatusBadge" class="px-4 py-2 rounded-xl font-extrabold text-base bg-slate-700 text-slate-300">
            OFF
          </div>
        </button>

        <!-- スイッチ3：入射角・反射角の表示 -->
        <button id="toggleAnglesBtn" onclick="toggleAnglesDisplay()" class="btn-push w-full bg-slate-900 hover:bg-slate-850 border-2 border-slate-600 rounded-2xl p-3 flex items-center justify-between text-left transition-all">
          <div class="flex items-center gap-3">
            <div id="anglesIconBox" class="w-12 h-12 rounded-xl bg-slate-700 flex items-center justify-center text-2xl">
              ✨
            </div>
            <div>
              <div class="text-base lg:text-lg font-extrabold text-white">入射角・反射角を表示</div>
              <div class="text-xs lg:text-sm font-bold text-slate-400">2つの角度の大きさをくらべよう</div>
            </div>
          </div>
          <div id="anglesStatusBadge" class="px-4 py-2 rounded-xl font-extrabold text-base bg-slate-700 text-slate-300">
            OFF
          </div>
        </button>
      </div>

      <!-- パネル3：まとめ・法則ボックス -->
      <div id="summaryCard" class="bg-slate-800 border-2 border-slate-700 rounded-2xl px-4 py-3 shadow-lg flex items-center justify-between">
        <div class="text-sm lg:text-base font-bold text-slate-300">
          💡 まずは「▶ 光を発射！」を押すか、「鏡に垂直な線（法線）」をONにしてみよう！
        </div>
      </div>

    </aside>
  </main>

  <script>
    // ==========================================
    // 定数と状態管理
    // ==========================================
    const ORIGIN_X = 500;       // 鏡の入射点X座標
    const ORIGIN_Y = 520;       // 鏡の入射点Y座標
    const POINTER_RADIUS = 380; // 入射点からレーザーポインターまでの距離
    const BEAM_RADIUS = 430;    // 反射光の長さ

    let state = {
      angle: 50,                // 現在の入射角（0〜80、10刻み）
      showNormal: false,        // 鏡に垂直な線（法線）の表示
      showProtractor: false,    // 分度器の表示
      showAngles: false,        // 入射角・反射角の数値表示
      slowMotion: true,         // ゆっくりアニメーションモード（デフォルトON）
      beamProgress: 0.0,        // 光の発射アニメーション進行度 (0.0: 消灯, 0.0 -> 1.0: 入射光, 1.0 -> 2.0: 反射光)
      isAnimatingBeam: false,   // 発射アニメーション中か
      particleOffset: 0         // 定常時の光の粒アニメーションオフセット
    };

    // ==========================================
    // 初期化処理
    // ==========================================
    window.onload = function () {
      initAngleButtons();
      initProtractorGraphics();
      initSnapDots();
      initDragEvents();
      updateUI();
      requestAnimationFrame(animationLoop);
    };

    // 0°〜80°の角度ボタンを生成
    function initAngleButtons() {
      const grid = document.getElementById('angleButtonsGrid');
      grid.innerHTML = '';
      for (let a = 0; a <= 80; a += 10) {
        const btn = document.createElement('button');
        btn.id = `angleBtn-${a}`;
        btn.className = 'btn-push py-2.5 rounded-xl font-extrabold text-base lg:text-lg border-2 transition-all';
        btn.textContent = `${a}°`;
        btn.onclick = () => setAngle(a, true);
        grid.appendChild(btn);
      }
    }

    // 10°ごとのスナップ位置の目印ドットをキャンバスに描画
    function initSnapDots() {
      const group = document.getElementById('snapDotsGroup');
      for (let a = 0; a <= 80; a += 10) {
        const rad = (a * Math.PI) / 180;
        const x = ORIGIN_X - POINTER_RADIUS * Math.sin(rad);
        const y = ORIGIN_Y - POINTER_RADIUS * Math.cos(rad);

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('r', '5');
        circle.setAttribute('fill', '#64748b');
        group.appendChild(circle);
      }
    }

    // 分度器の目盛り（法線=0°から左右に0°〜90°）を生成
    function initProtractorGraphics() {
      const ticksGroup = document.getElementById('protractorTicks');
      const outerR = 320;
      const labelR = 282;

      for (let deg = -90; deg <= 90; deg += 5) {
        const absDeg = Math.abs(deg);
        const rad = (deg * Math.PI) / 180;
        const isMajor = absDeg % 10 === 0;
        const innerR = isMajor ? outerR - 18 : outerR - 10;

        const x1 = ORIGIN_X + outerR * Math.sin(rad);
        const y1 = ORIGIN_Y - outerR * Math.cos(rad);
        const x2 = ORIGIN_X + innerR * Math.sin(rad);
        const y2 = ORIGIN_Y - innerR * Math.cos(rad);

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', absDeg === 0 ? '#38bdf8' : (isMajor ? '#e2e8f0' : '#64748b'));
        line.setAttribute('stroke-width', absDeg === 0 ? '4' : (isMajor ? '2.5' : '1.5'));
        ticksGroup.appendChild(line);

        // 10°単位の数字ラベルを描画
        if (isMajor && absDeg <= 80) {
          const lx = ORIGIN_X + labelR * Math.sin(rad);
          const ly = ORIGIN_Y - labelR * Math.cos(rad);

          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', lx);
          text.setAttribute('y', ly + 7);
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('fill', absDeg === 0 ? '#38bdf8' : (deg < 0 ? '#fda4af' : '#fde68a'));
          text.setAttribute('font-size', absDeg === 0 ? '24' : '20');
          text.setAttribute('font-weight', '800');
          text.textContent = `${absDeg}`;
          ticksGroup.appendChild(text);
        }
      }
    }

    // ==========================================
    // 角度の変更とアニメーション制御
    // ==========================================
    function setAngle(newAngle, resetBeam = true) {
      const clamped = Math.max(0, Math.min(80, Math.round(newAngle / 10) * 10));
      const changed = state.angle !== clamped;
      state.angle = clamped;

      document.getElementById('angleSlider').value = clamped;

      // 角度を変えたときは一旦光を消して、「光を発射！」ボタンで発射できるようにする
      if (resetBeam && changed) {
        state.beamProgress = 0.0;
        state.isAnimatingBeam = false;
        document.getElementById('btnFire').classList.add('animate-pulse');
        const btnRing = document.getElementById('pointerBtnRing');
        if (btnRing) btnRing.style.display = 'block';
      }

      updateUI();
    }

    // 光がレーザーポインターから発射されて鏡で跳ね返るアニメーションを開始
    function replayBeamAnimation() {
      state.beamProgress = 0.001;
      state.isAnimatingBeam = true;
      document.getElementById('btnFire').classList.remove('animate-pulse');
      const btnRing = document.getElementById('pointerBtnRing');
      if (btnRing) btnRing.style.display = 'none';

      // 赤いスイッチボタンを押したときの視覚フィードバック
      const btnBody = document.getElementById('pointerBtnBody');
      if (btnBody) {
        btnBody.setAttribute('fill', '#fda4af');
        setTimeout(() => btnBody.setAttribute('fill', '#e11d48'), 200);
      }

      updateGuideMessages(state.angle);
    }

    // ゆっくり見るモードの切り替え
    function toggleSlowMotion() {
      state.slowMotion = !state.slowMotion;
      const btn = document.getElementById('btnSlow');
      const label = document.getElementById('slowLabel');

      if (state.slowMotion) {
        btn.className = 'btn-push bg-amber-500 hover:bg-amber-400 border-2 border-amber-200 text-slate-950 font-extrabold px-4 py-2.5 rounded-2xl text-base lg:text-lg flex items-center gap-2 shadow-lg';
        label.textContent = 'ゆっくり見る：ON';
      } else {
        btn.className = 'btn-push bg-slate-800 hover:bg-slate-700 border-2 border-slate-600 text-slate-200 font-bold px-4 py-2.5 rounded-2xl text-base lg:text-lg flex items-center gap-2 shadow-md';
        label.textContent = 'ゆっくり見る：OFF';
      }
    }

    // ==========================================
    // 表示トグルスイッチ制御
    // ==========================================
    function toggleNormalLine() {
      state.showNormal = !state.showNormal;
      updateUI();
    }

    function toggleProtractor() {
      state.showProtractor = !state.showProtractor;
      updateUI();
    }

    function toggleAnglesDisplay() {
      state.showAngles = !state.showAngles;
      // 入射角・反射角を表示するとき、基準となる法線も一緒に表示する
      if (state.showAngles && !state.showNormal) {
        state.showNormal = true;
      }
      updateUI();
    }

    // ==========================================
    // 画面・SVG要素の更新
    // ==========================================
    function updateUI() {
      const a = state.angle;
      const rad = (a * Math.PI) / 180;

      // 現在の設定バッジ更新
      const badge = document.getElementById('currentSettingBadge');
      badge.textContent = state.showAngles ? `入射角：${a}°` : `角度：${a}°`;

      // 角度ボタンのハイライト更新
      for (let deg = 0; deg <= 80; deg += 10) {
        const btn = document.getElementById(`angleBtn-${deg}`);
        if (deg === a) {
          btn.className = 'btn-push py-2.5 rounded-xl font-extrabold text-base lg:text-lg border-2 bg-rose-500 border-white text-white shadow-lg shadow-rose-500/40';
        } else {
          btn.className = 'btn-push py-2.5 rounded-xl font-extrabold text-base lg:text-lg border-2 bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500';
        }
      }

      // レーザーポインターの位置と向きを更新
      const pointerX = ORIGIN_X - POINTER_RADIUS * Math.sin(rad);
      const pointerY = ORIGIN_Y - POINTER_RADIUS * Math.cos(rad);
      const rotDeg = 90 - a;
      const pointerGroup = document.getElementById('laserPointerGroup');
      pointerGroup.setAttribute('transform', `translate(${pointerX}, ${pointerY}) rotate(${rotDeg})`);

      // 各レイヤーの表示/非表示を更新
      document.getElementById('normalLineLayer').style.opacity = state.showNormal ? '1' : '0';
      document.getElementById('protractorLayer').style.opacity = state.showProtractor ? '1' : '0';
      document.getElementById('angleValueLayer').style.opacity = state.showAngles ? '1' : '0';

      // トグルボタンの見た目更新
      updateSwitchStyle('toggleNormalBtn', 'normalStatusBadge', 'normalIconBox', state.showNormal, 'sky');
      updateSwitchStyle('toggleProtractorBtn', 'protractorStatusBadge', 'protractorIconBox', state.showProtractor, 'sky');
      updateSwitchStyle('toggleAnglesBtn', 'anglesStatusBadge', 'anglesIconBox', state.showAngles, 'amber');

      // 扇形と角度ラベルの位置・テキスト更新
      updateAngleArcs(a, rad);

      // 上部ガイドと下部まとめメッセージの更新
      updateGuideMessages(a);
    }

    function updateSwitchStyle(btnId, badgeId, iconBoxId, isActive, colorType) {
      const btn = document.getElementById(btnId);
      const badge = document.getElementById(badgeId);
      const iconBox = document.getElementById(iconBoxId);

      if (isActive) {
        if (colorType === 'amber') {
          btn.className = 'btn-push w-full bg-amber-950/60 border-2 border-amber-400 rounded-2xl p-3 flex items-center justify-between text-left transition-all shadow-lg shadow-amber-500/10';
          badge.className = 'px-4 py-2 rounded-xl font-extrabold text-base bg-amber-400 text-slate-950';
          iconBox.className = 'w-12 h-12 rounded-xl bg-amber-500/30 border border-amber-400 flex items-center justify-center text-2xl';
        } else {
          btn.className = 'btn-push w-full bg-sky-950/60 border-2 border-sky-400 rounded-2xl p-3 flex items-center justify-between text-left transition-all shadow-lg shadow-sky-500/10';
          badge.className = 'px-4 py-2 rounded-xl font-extrabold text-base bg-sky-400 text-slate-950';
          iconBox.className = 'w-12 h-12 rounded-xl bg-sky-500/30 border border-sky-400 flex items-center justify-center text-2xl font-extrabold text-sky-300';
        }
        badge.textContent = 'ON';
      } else {
        btn.className = 'btn-push w-full bg-slate-900 hover:bg-slate-850 border-2 border-slate-600 rounded-2xl p-3 flex items-center justify-between text-left transition-all';
        badge.className = 'px-4 py-2 rounded-xl font-extrabold text-base bg-slate-700 text-slate-300';
        iconBox.className = 'w-12 h-12 rounded-xl bg-slate-700 flex items-center justify-center text-2xl font-extrabold text-sky-400';
        badge.textContent = 'OFF';
      }
    }

    function updateAngleArcs(a, rad) {
      const incArc = document.getElementById('incidentArc');
      const refArc = document.getElementById('reflectionArc');
      const incLabel = document.getElementById('incidentLabelGroup');
      const refLabel = document.getElementById('reflectionLabelGroup');
      const zeroBadge = document.getElementById('zeroDegreeBadge');

      if (a === 0) {
        incArc.style.display = 'none';
        refArc.style.display = 'none';
        incLabel.style.display = 'none';
        refLabel.style.display = 'none';
        zeroBadge.style.display = 'block';
        return;
      }

      incArc.style.display = 'block';
      refArc.style.display = 'block';
      incLabel.style.display = 'block';
      refLabel.style.display = 'block';
      zeroBadge.style.display = 'none';

      const arcR = 160;
      const incX = ORIGIN_X - arcR * Math.sin(rad);
      const incY = ORIGIN_Y - arcR * Math.cos(rad);
      const refX = ORIGIN_X + arcR * Math.sin(rad);
      const refY = ORIGIN_Y - arcR * Math.cos(rad);
      const topY = ORIGIN_Y - arcR;

      // 入射角の扇形パス（入射光から法線まで）
      incArc.setAttribute('d', `M ${ORIGIN_X} ${ORIGIN_Y} L ${incX} ${incY} A ${arcR} ${arcR} 0 0 1 ${ORIGIN_X} ${topY} Z`);
      // 反射角の扇形パス（法線から反射光まで）
      refArc.setAttribute('d', `M ${ORIGIN_X} ${ORIGIN_Y} L ${ORIGIN_X} ${topY} A ${arcR} ${arcR} 0 0 1 ${refX} ${refY} Z`);

      // ラベルの位置計算（角度が小さいときも重ならないよう最小距離を確保）
      const midRad = rad / 2;
      const labelDist = 225;
      const offsetX = Math.max(110, labelDist * Math.sin(midRad));
      const offsetY = labelDist * Math.cos(midRad);

      incLabel.setAttribute('transform', `translate(${ORIGIN_X - offsetX}, ${ORIGIN_Y - offsetY})`);
      refLabel.setAttribute('transform', `translate(${ORIGIN_X + offsetX}, ${ORIGIN_Y - offsetY})`);

      document.getElementById('incidentAngleText').textContent = `${a}°`;
      document.getElementById('reflectionAngleText').textContent = `${a}°`;
    }

    function updateGuideMessages(a) {
      const guideText = document.getElementById('guideText');
      const summaryCard = document.getElementById('summaryCard');

      if (state.showAngles) {
        guideText.textContent = `入射角 ${a}° ＝ 反射角 ${a}° ！ どんな角度でも必ず同じ大きさになるね！`;
        summaryCard.className = 'bg-gradient-to-r from-rose-950/90 via-slate-900 to-amber-950/90 border-2 border-amber-400 rounded-2xl px-4 py-3 shadow-lg flex items-center justify-between';
        summaryCard.innerHTML = `
          <div class="w-full text-center">
            <div class="text-xs lg:text-sm font-bold text-amber-300">✨ 光の反射の法則 ✨</div>
            <div class="text-base lg:text-xl font-extrabold text-white mt-0.5">
              <span class="text-rose-400">入射角(${a}°)</span> ＝ <span class="text-amber-400">反射角(${a}°)</span>
            </div>
          </div>
        `;
      } else if (state.showProtractor) {
        guideText.textContent = `分度器の目盛りを読んでみよう！垂直な線(0°)から何度のところを通っているかな？`;
        summaryCard.className = 'bg-slate-800 border-2 border-sky-400/70 rounded-2xl px-4 py-3 shadow-lg flex items-center justify-between';
        summaryCard.innerHTML = `
          <div class="text-sm lg:text-base font-bold text-slate-200">
            📐 最後に「<span class="text-amber-300 font-extrabold">入射角・反射角を表示</span>」をONにして答え合わせしよう！
          </div>
        `;
      } else if (state.showNormal) {
        guideText.textContent = `鏡に垂直な線（法線）が引けたね！次は「分度器をおく」をONにして角度をはかろう！`;
        summaryCard.className = 'bg-slate-800 border-2 border-sky-400/70 rounded-2xl px-4 py-3 shadow-lg flex items-center justify-between';
        summaryCard.innerHTML = `
          <div class="text-sm lg:text-base font-bold text-slate-200">
            ⚠️ 鏡との間の角ではなく、<span class="text-sky-300 font-extrabold">鏡に垂直な線</span>との間の角をはかるよ！
          </div>
        `;
      } else {
        if (state.beamProgress === 0) {
          guideText.textContent = `レーザーの赤いボタンか、右上の「▶ 光を発射！」を押してみよう！`;
        } else {
          guideText.textContent = `光がはね返ったね！右の「鏡に垂直な線（法線）」をONにして角度を調べよう！`;
        }
        summaryCard.className = 'bg-slate-800 border-2 border-slate-700 rounded-2xl px-4 py-3 shadow-lg flex items-center justify-between';
        summaryCard.innerHTML = `
          <div class="text-sm lg:text-base font-bold text-slate-300">
            💡 レーザーの赤いボタンを押すか、「鏡に垂直な線（法線）」をONにしてみよう！
          </div>
        `;
      }
    }

    // ==========================================
    // 光の進行アニメーションループ
    // ==========================================
    function animationLoop() {
      const rad = (state.angle * Math.PI) / 180;

      // レーザー発射口の位置（ポインター中心から先端方向へ44px進んだ位置）
      const startDist = POINTER_RADIUS - 44;
      const startX = ORIGIN_X - startDist * Math.sin(rad);
      const startY = ORIGIN_Y - startDist * Math.cos(rad);

      // 反射光の終点
      const endX = ORIGIN_X + BEAM_RADIUS * Math.sin(rad);
      const endY = ORIGIN_Y - BEAM_RADIUS * Math.cos(rad);

      // 発射アニメーションの進行計算（ゆっくり見るモードをさらに少しゆっくりに調整）
      if (state.isAnimatingBeam) {
        const speed = state.slowMotion ? 0.011 : 0.05;
        state.beamProgress += speed;
        if (state.beamProgress >= 2.0) {
          state.beamProgress = 2.0;
          state.isAnimatingBeam = false;
        }
      }

      // 入射光（0.0 -> 1.0）の描画座標
      const incT = Math.min(1.0, state.beamProgress);
      const curIncX = startX + (ORIGIN_X - startX) * incT;
      const curIncY = startY + (ORIGIN_Y - startY) * incT;

      const incGlow = document.getElementById('incidentBeamGlow');
      const incCore = document.getElementById('incidentBeamCore');
      if (incT > 0) {
        incGlow.style.display = 'block';
        incCore.style.display = 'block';
        incGlow.setAttribute('x1', startX);
        incGlow.setAttribute('y1', startY);
        incGlow.setAttribute('x2', curIncX);
        incGlow.setAttribute('y2', curIncY);
        incCore.setAttribute('x1', startX);
        incCore.setAttribute('y1', startY);
        incCore.setAttribute('x2', curIncX);
        incCore.setAttribute('y2', curIncY);
      } else {
        incGlow.style.display = 'none';
        incCore.style.display = 'none';
      }

      // 鏡の衝突点の光エフェクト
      const hitGlow = document.getElementById('hitPointGlow');
      const hitCore = document.getElementById('hitPointCore');
      const hitOpacity = state.beamProgress >= 0.98 ? '1' : '0';
      hitGlow.style.opacity = hitOpacity;
      hitCore.style.opacity = hitOpacity;

      // 反射光（1.0 -> 2.0）の描画座標
      const refT = Math.max(0.0, Math.min(1.0, state.beamProgress - 1.0));
      // 0°のときは入射光と反射光の両方が見えるように5pxだけ横にずらす
      const zeroOffset = state.angle === 0 ? 5 : 0;
      const refStartX = ORIGIN_X + zeroOffset;
      const curRefX = refStartX + (endX + zeroOffset - refStartX) * refT;
      const curRefY = ORIGIN_Y + (endY - ORIGIN_Y) * refT;

      const refGlow = document.getElementById('reflectionBeamGlow');
      const refCore = document.getElementById('reflectionBeamCore');
      if (refT > 0) {
        refGlow.style.display = 'block';
        refCore.style.display = 'block';
        refGlow.setAttribute('x1', refStartX);
        refGlow.setAttribute('y1', ORIGIN_Y);
        refGlow.setAttribute('x2', curRefX);
        refGlow.setAttribute('y2', curRefY);
        refCore.setAttribute('x1', refStartX);
        refCore.setAttribute('y1', ORIGIN_Y);
        refCore.setAttribute('x2', curRefX);
        refCore.setAttribute('y2', curRefY);
      } else {
        refGlow.style.display = 'none';
        refCore.style.display = 'none';
      }

      // 光の線上を流れる進行方向の矢印（光の粒）を更新
      updateMovingParticles(startX, startY, endX + zeroOffset, endY, refStartX, incT, refT);

      requestAnimationFrame(animationLoop);
    }

    // 光の進む向きがひと目でわかる動く矢印を描画
    function updateMovingParticles(startX, startY, endX, endY, refStartX, incT, refT) {
      const group = document.getElementById('movingParticlesGroup');
      group.innerHTML = '';

      if (incT <= 0) return;

      const stepSpeed = state.slowMotion ? 0.0028 : 0.011;
      state.particleOffset = (state.particleOffset + stepSpeed) % 1.0;

      const numParticles = 3;

      // 入射光上の動く矢印（ポインター → 鏡）
      for (let i = 0; i < numParticles; i++) {
        const t = (state.particleOffset + i / numParticles) % 1.0;
        if (t <= incT) {
          const px = startX + (ORIGIN_X - startX) * t;
          const py = startY + (ORIGIN_Y - startY) * t;
          const angleDeg = 90 - state.angle;
          group.appendChild(createArrowParticle(px, py, angleDeg, '#ffffff', '#f43f5e'));
        }
      }

      // 反射光上の動く矢印（鏡 → 反射方向）
      if (refT > 0) {
        for (let i = 0; i < numParticles; i++) {
          const t = (state.particleOffset + i / numParticles) % 1.0;
          if (t <= refT) {
            const px = refStartX + (endX - refStartX) * t;
            const py = ORIGIN_Y + (endY - ORIGIN_Y) * t;
            const angleDeg = -90 + state.angle;
            group.appendChild(createArrowParticle(px, py, angleDeg, '#ffffff', '#f59e0b'));
          }
        }
      }
    }

    function createArrowParticle(x, y, deg, fill, stroke) {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('transform', `translate(${x}, ${y}) rotate(${deg})`);

      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('points', '-9,-8 10,0 -9,8 -4,0');
      poly.setAttribute('fill', fill);
      poly.setAttribute('stroke', stroke);
      poly.setAttribute('stroke-width', '2');
      g.appendChild(poly);
      return g;
    }

    // ==========================================
    // iPadタッチ＆マウスドラッグ操作（10°単位スナップ）
    // ==========================================
    // iPadタッチ＆マウスドラッグ操作（10°単位スナップ＋赤いボタン発射対応）
    // ==========================================
    function initDragEvents() {
      const svg = document.getElementById('simSvg');
      const pointer = document.getElementById('laserPointerGroup');
      let isDragging = false;
      let isTapCandidate = false;
      let startClientX = 0;
      let startClientY = 0;

      const startDrag = (e) => {
        isDragging = true;
        isTapCandidate = true;
        startClientX = e.touches ? e.touches[0].clientX : e.clientX;
        startClientY = e.touches ? e.touches[0].clientY : e.clientY;
        e.preventDefault();
      };

      const moveDrag = (e) => {
        if (!isDragging) return;
        e.preventDefault();

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        // タップかドラッグかを判定（12px以上動いたらドラッグとみなす）
        const moveDist = Math.hypot(clientX - startClientX, clientY - startClientY);
        if (moveDist < 12 && isTapCandidate) {
          return;
        }
        isTapCandidate = false;

        // SVG座標系に変換
        const pt = svg.createSVGPoint();
        pt.x = clientX;
        pt.y = clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());

        // 入射点(ORIGIN_X, ORIGIN_Y)からの角度を計算
        const dx = ORIGIN_X - svgP.x;
        const dy = ORIGIN_Y - svgP.y;

        if (dy <= 10) {
          setAngle(80, true);
          return;
        }

        let deg = (Math.atan2(dx, dy) * 180) / Math.PI;
        deg = Math.max(0, Math.min(80, deg));
        // 10°単位にカチッとスナップ
        const snapped = Math.round(deg / 10) * 10;
        if (snapped !== state.angle) {
          setAngle(snapped, true);
        }
      };

      const endDrag = () => {
        if (isDragging) {
          // ドラッグせずにその場でタップ（クリック）した場合は光を発射
          if (isTapCandidate) {
            replayBeamAnimation();
          }
          isDragging = false;
          isTapCandidate = false;
        }
      };

      pointer.addEventListener('mousedown', startDrag);
      pointer.addEventListener('touchstart', startDrag, { passive: false });

      window.addEventListener('mousemove', moveDrag);
      window.addEventListener('touchmove', moveDrag, { passive: false });

      window.addEventListener('mouseup', endDrag);
      window.addEventListener('touchend', endDrag);
    }
  </script>
